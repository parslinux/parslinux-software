<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="128"
   height="128"
   viewBox="0 0 128 128"
   version="1.1"
   id="parslinux-software-icon"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Background Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.45" />
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Base Canvas Gradient -->
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Subtle Edge Highlight -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Shopping Bag Front Gradient -->
    <linearGradient id="bagGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Brand Emblem Gradient -->
    <linearGradient id="emblemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Rectangle with Shadow -->
  <rect
     x="10"
     y="10"
     width="108"
     height="108"
     rx="26"
     ry="26"
     fill="url(#baseGradient)"
     filter="url(#dropShadow)" />

  <!-- Inner Stroke Highlight -->
  <rect
     x="11"
     y="11"
     width="106"
     height="106"
     rx="25"
     ry="25"
     fill="none"
     stroke="url(#borderGradient)"
     stroke-width="1.5" />

  <!-- Shopping Bag Handle -->
  <path
     d="M 48 42 C 48 31 55 24 64 24 C 73 24 80 31 80 42"
     fill="none"
     stroke="url(#handleGradient)"
     stroke-width="6.5"
     stroke-linecap="round" />

  <!-- Shopping Bag Body -->
  <path
     d="M 33 46 C 31 46 29 48 30 50 L 37 100 C 38 103 40 105 44 105 L 84 105 C 88 105 90 103 91 100 L 98 50 C 99 48 97 46 95 46 Z"
     fill="url(#bagGradient)"
     filter="url(#dropShadow)" />

  <!-- Shopping Bag Fold / Depth Accent -->
  <path
     d="M 30 52 L 98 52"
     stroke="#cbd5e1"
     stroke-width="1.5" />

  <!-- Stylized Pars "P" & Software Diamond / Arrow Motif -->
  <!-- Main "P" Stem -->
  <path
     d="M 50 60 L 50 92 C 50 93.5 51.5 94.5 53 94.5 C 54.5 94.5 56 93.5 56 92 L 56 60 Z"
     fill="url(#emblemGradient)" />

  <!-- "P" Upper Loop / Arrow Wing -->
  <path
     d="M 54 60 C 54 60 76 56 76 69 C 76 81 58 79 54 79 Z"
     fill="url(#emblemGradient)" />

  <!-- Modern Software Sparkle / Diamond -->
  <path
     d="M 64 63 L 67 69 L 73 70 L 68 74 L 69 80 L 64 76 L 59 80 L 60 74 L 55 70 L 61 69 Z"
     fill="#ffffff"
     opacity="0.95" />

  <!-- Dynamic Download Accent Arrow at bottom right of bag -->
  <circle
     cx="86"
     cy="90"
     r="13"
     fill="#0284c7" />
  <path
     d="M 86 83 L 86 93 M 82 89 L 86 94 L 90 89"
     fill="none"
     stroke="#ffffff"
     stroke-width="2.6"
     stroke-linecap="round"
     stroke-linejoin="round" />
</svg>
